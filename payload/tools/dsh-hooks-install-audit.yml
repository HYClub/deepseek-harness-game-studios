# Config override for the installed `dsgs-hooks` package row.
#
# The package's own bundle patch inserts the row with `config: {}` on purpose (the plugin finds
# `<project>/.dsh/hooks.json` by walking up). This override adds only the invocation audit, which is
# how `tools/verify-plugin-install.ps1` proves the *installed package* actually executes hooks
# rather than merely appearing in the profile.
- id: dsgs-hooks
  config:
    auditFile: D:/Work/dsh/.verify-logs/hook-invocations.log
    defaultTimeoutMs: 15000

