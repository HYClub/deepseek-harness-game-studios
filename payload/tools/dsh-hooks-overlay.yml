# 便携 overlay：给任意 DSH profile 临时挂上 DSGS 工作室的钩子桥，不改那个 profile 的配置。
#
#   dsh hookcheck --from-default-profile headless --patch D:/Work/dsh/tools/dsh-hooks-overlay.yml "提示词"
#   dsh web --patch D:/Work/dsh/tools/dsh-hooks-overlay.yml        # 也可用在你自己启动的 profile 上
#
# configPath 必须是绝对路径：overlay 是 CLI 进程读的，不是项目读的。工程如果搬家，改这里即可
# （`.dsh/hooks.json` 本身是相对命令，不随路径变化）。
- insert:
    - id: hooks-claude-code
      name: "@deepseek-ai/dsh-hooks-claude-code"
      config:
        configPath: "D:/Work/dsh/.dsh/hooks.json"

